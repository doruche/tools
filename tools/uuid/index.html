<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UUID generator · doruche's tools</title>
  <link rel="icon" href="../kit/favicon.svg">
  <script type="module" src="./src/main.ts"></script>
</head>
<body>
  <a class="back" href="../">..</a>
  <header class="page-header">
    <h1>uuid</h1>
    <p><strong>UUID generator.</strong> Made in your browser with <code>crypto.getRandomValues</code>.</p>
  </header>
  <main>
    <form class="options" id="options" autocomplete="off">
      <fieldset class="option">
        <legend class="flag">--version</legend>
        <label class="choice"><input type="radio" name="version" value="4" checked> v4 <small>random</small></label>
        <label class="choice"><input type="radio" name="version" value="7"> v7 <small>time-ordered</small></label>
      </fieldset>
      <div class="option">
        <label class="flag" for="count">--count</label>
        <input class="term count" id="count" type="number" name="count" min="1" max="1000" value="10" required>
      </div>
      <div class="option">
        <label class="check"><input type="checkbox" name="uppercase"> uppercase</label>
        <label class="check"><input type="checkbox" name="hyphens" checked> hyphens</label>
      </div>
    </form>
    <ol class="lines" id="output" aria-label="Generated UUIDs"></ol>
    <div class="actions">
      <button type="button" class="cmd primary" id="generate">generate</button>
      <button type="button" class="cmd" id="copy">copy all</button>
    </div>
  </main>
  <footer class="colophon"><span>© 2026 doruche</span><a href="https://github.com/doruche/tools/tree/main/tools/uuid">source</a></footer>
</body>
</html>
