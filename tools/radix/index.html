<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base converter · doruche's tools</title>
  <link rel="icon" href="../kit/favicon.svg">
  <link rel="stylesheet" href="../kit/kit.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="back" href="../">..</a>
  <header class="page-header">
    <h1>radix</h1>
    <p><strong>Base converter.</strong> Type in any field and the others follow. Spaces, underscores and 0b/0o/0x prefixes are fine.</p>
  </header>
  <main>
    <form class="fields" autocomplete="off" spellcheck="false">
      <div class="field" data-base="2">
        <label class="flag" for="base-2">--bin</label>
        <input class="term" id="base-2" inputmode="numeric" aria-describedby="error-2">
        <button type="button" class="cmd" aria-label="Copy binary">copy</button>
        <p class="log error" id="error-2" role="alert"></p>
      </div>
      <div class="field" data-base="8">
        <label class="flag" for="base-8">--oct</label>
        <input class="term" id="base-8" inputmode="numeric" aria-describedby="error-8">
        <button type="button" class="cmd" aria-label="Copy octal">copy</button>
        <p class="log error" id="error-8" role="alert"></p>
      </div>
      <div class="field" data-base="10">
        <label class="flag" for="base-10">--dec</label>
        <input class="term" id="base-10" inputmode="numeric" aria-describedby="error-10">
        <button type="button" class="cmd" aria-label="Copy decimal">copy</button>
        <p class="log error" id="error-10" role="alert"></p>
      </div>
      <div class="field" data-base="16">
        <label class="flag" for="base-16">--hex</label>
        <input class="term" id="base-16" aria-describedby="error-16">
        <button type="button" class="cmd" aria-label="Copy hex">copy</button>
        <p class="log error" id="error-16" role="alert"></p>
      </div>
      <div class="field" data-base="36" id="custom-field">
        <span class="flag">
          <label for="base-custom">--base=</label><span class="select"><select class="term" id="custom-base" aria-label="Custom base"></select></span>
        </span>
        <input class="term" id="base-custom" aria-describedby="error-custom">
        <button type="button" class="cmd" aria-label="Copy custom base">copy</button>
        <p class="log error" id="error-custom" role="alert"></p>
      </div>
    </form>
    <div class="status-bar">
      <label class="check"><input type="checkbox" id="uppercase"> uppercase</label>
      <output class="log" id="size" aria-live="polite"></output>
    </div>
  </main>
  <footer class="colophon"><span>© 2026 doruche</span><a href="https://github.com/doruche/tools/tree/main/tools/radix">source</a></footer>
</body>
</html>
